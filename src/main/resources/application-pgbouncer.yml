# Profile "pgbouncer": routes the pool through PgBouncer (port 6432) instead of
# connecting to PostgreSQL directly on 5432.
# Only the port is overridden; everything else comes from application.yml.
# Activate with: --spring.profiles.active=pgbouncer
app:
  datasources:
    appdb:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${PGBOUNCER_PORT:6432}/${DB_NAME:appdb}
