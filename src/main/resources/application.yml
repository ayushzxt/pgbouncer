# Single database. Every entry under app.datasources becomes a DataSource bean named
# after its key. Keys are HikariCP property names (kebab-case), so every Hikari
# setting is available; unknown keys fail startup.
# Driver-specific settings go under data-source-properties.
# Secrets: use ${ENV_VAR} or ${ENV_VAR:default}.
# The pool key is also the name accepted by GET /api/{dbName}/employees.
app:
  # hikari = pooled (HikariCP). none = a new physical connection per request,
  # i.e. no pooling at all, for benchmarking raw PostgreSQL connection cost.
  pooling: ${APP_POOLING:hikari}
  # Marks the pool @Primary so Boot's single-DataSource auto-config
  # (JdbcTemplate, JdbcClient, transactions) targets it.
  primary-datasource: appdb
  datasources:
    appdb:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
      username: ${DB_USERNAME:appuser}
      password: ${DB_PASSWORD:apppass}
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
